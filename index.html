        /* Helper to Render TeX */
        function renderMathText(element, text) {
            element.innerHTML = text;
            if (window.renderMathInElement) {
                renderMathInElement(element, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},

                });

        /* ------------------------------------------------------------------
           2. WEB AUDIO SYNTHESIZER (SE)
        ------------------------------------------------------------------ */
        class SoundFX {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playTone(freq, duration, type = 'sine', volume = 0.2) {
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playBuzz() { this.playTone(440, 0.25, 'square', 0.3); }
            playCorrect() {
                this.init();
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => setTimeout(() => this.playTone(f, 0.3, 'triangle', 0.25), i * 80));
            }
            playWrong() { this.playTone(180, 0.4, 'sawtooth', 0.3); }
            playTick() { this.playTone(800, 0.05, 'sine', 0.1); }
            playFanfare() {
                this.init();
                [523.25, 659.25, 783.99, 1046.50, 880, 1046.50].forEach((f, i) => setTimeout(() => this.playTone(f, 0.4, 'triangle', 0.3), i * 120));
            }
        }
        const sfx = new SoundFX();

        localStorage.setItem('quiz_viewer_id', viewerId);

        let myPersonalScore = parseInt(localStorage.getItem('quiz_my_score') || '0', 10);
        let currentState = null;
        let timerInterval = null;

        let unsubscribeGlobal = null;

        /* ------------------------------------------------------------------

        const screenLobby = document.getElementById('screen-lobby');
        const screenLeader = document.getElementById('screen-leader');

        /* ------------------------------------------------------------------
           5. FIREBASE INITIALIZATION
        ------------------------------------------------------------------ */
        function initFirebase() {
            let config = DEFAULT_FIREBASE_CONFIG;
            const savedConfig = localStorage.getItem('firebase_config');
            if (savedConfig) {
                try { config = JSON.parse(savedConfig); } catch(e) {}
            }
            try {
                if (!firebase.apps.length) firebase.initializeApp(config);
                db = firebase.firestore();
                firebaseStatusBadge.className = "w-2 h-2 rounded-full bg-emerald-400 inline-block";
                listenGlobalState();
                return true;
            } catch (e) {
                firebaseStatusBadge.className = "w-2 h-2 rounded-full bg-red-500 inline-block";
            }
            return false;
        }

        saveFirebaseConfigBtn.addEventListener('click', () => {
            const rawVal = firebaseConfigInput.value.trim();
            try {
                const match = rawVal.match(/\{[\s\S]*\}/);
                if (!match) throw new Error("{ ... } のオブジェクトが見つかりません。");
                const parseFn = new Function('return ' + match[0]);
                const parsedConfig = parseFn();
                if (!parsedConfig || !parsedConfig.apiKey) throw new Error("apiKey が存在しません。");
                localStorage.setItem('firebase_config', JSON.stringify(parsedConfig));
                firebaseModal.classList.add('hidden');
                location.reload();
            } catch (err) {
                alert("設定の解析に失敗しました:\n" + err.message);
            }
        });

        resetDefaultConfigBtn.addEventListener('click', () => {
            if (confirm("標準Firebase設定に戻しますか？")) {
                localStorage.removeItem('firebase_config');
                location.reload();
            }
        });

        firebaseConfigBtn.addEventListener('click', () => {
            const saved = localStorage.getItem('firebase_config');
            firebaseConfigInput.value = saved || JSON.stringify(DEFAULT_FIREBASE_CONFIG, null, 2);
            firebaseModal.classList.remove('hidden');
        });
        closeModalBtn.addEventListener('click', () => firebaseModal.classList.add('hidden'));

        /* ------------------------------------------------------------------
           6. FIRESTORE SYNCHRONIZATION
        ------------------------------------------------------------------ */
        function listenGlobalState() {
            if (!db) return;
            if (unsubscribeGlobal) unsubscribeGlobal();

            const docRef = db.collection('quiz_room').doc('global_state');
            unsubscribeGlobal = docRef.onSnapshot((doc) => {
                if (!doc.exists) {
                    docRef.set({
                        status: 'lobby',
                        currentIndex: 0,
                        startTime: 0,
                        teamAScore: 0,
                        teamBScore: 0,
                        leaderResult: null
                    });
                    return;
                }
                currentState = doc.data();
                renderUI();
            });
        }

        /* ------------------------------------------------------------------
           7. UI ROUTING
        ------------------------------------------------------------------ */
        function setRole(role) {
            myRole = role;
            localStorage.setItem('quiz_role', role);
            if (role) resetRoleBtn.classList.remove('hidden');
            else resetRoleBtn.classList.add('hidden');
            renderUI();
        }

        resetRoleBtn.addEventListener('click', () => {
            if (confirm("役割を変更してロビーに戻りますか？")) setRole(null);
        });

        document.getElementById('select-leader-btn').addEventListener('click', () => setRole('leader'));
        document.getElementById('select-viewer-a-btn').addEventListener('click', () => setRole('viewer_A'));
        document.getElementById('select-viewer-b-btn').addEventListener('click', () => setRole('viewer_B'));

        function renderUI() {
            if (!myRole) { showScreen('lobby'); return; }
            if (!currentState) return;

            const status = currentState.status;
            if (status === 'finished') { showScreen('finished'); renderFinishedView(); return; }

            if (myRole === 'leader') {
                showScreen('leader');
                renderLeaderView();
            } else if (myRole === 'viewer_A' || myRole === 'viewer_B') {
                showScreen('viewer');
                renderViewerView();
            }
        }

        function showScreen(screenName) {
            screenLobby.classList.add('hidden');
            screenLeader.classList.add('hidden');
            screenViewer.classList.add('hidden');
            screenFinished.classList.add('hidden');

            if (screenName === 'lobby') screenLobby.classList.remove('hidden');
            if (screenName === 'leader') screenLeader.classList.remove('hidden');
            if (screenName === 'viewer') screenViewer.classList.remove('hidden');
            if (screenName === 'finished') screenFinished.classList.remove('hidden');
        }

        /* ------------------------------------------------------------------
           8. LEADER VIEW LOGIC
        ------------------------------------------------------------------ */
        function renderLeaderView() {
            const qIndex = currentState.currentIndex;
            const qData = questionBank[qIndex] || questionBank[0];

            document.getElementById('leader-team-a-score').innerHTML = `${currentState.teamAScore}<span class="text-xs text-slate-400">pt</span>`;
            document.getElementById('leader-team-b-score').innerHTML = `${currentState.teamBScore}<span class="text-xs text-slate-400">pt</span>`;

            document.getElementById('leader-q-number').textContent = `Q${qIndex + 1}/${questionBank.length}`;
            
            const diffBox = document.getElementById('leader-q-difficulty');
            diffBox.innerHTML = '';
            for (let i = 0; i < qData.difficulty; i++) diffBox.innerHTML += '<i class="fa-solid fa-star"></i>';

            if (lastRenderedQIndex !== qIndex) {
                lastRenderedQIndex = qIndex;
                renderMathText(document.getElementById('leader-q-text'), qData.questionText);
                renderMathText(document.getElementById('leader-opt-1-text'), qData.option1);
                renderMathText(document.getElementById('leader-opt-2-text'), qData.option2);
            }

            const startBtn = document.getElementById('leader-start-btn');
            const closeBtn = document.getElementById('leader-close-ans-btn');
            const nextBtn = document.getElementById('leader-next-btn');

            if (currentState.status === 'lobby') {
                startBtn.classList.remove('hidden');
                closeBtn.classList.add('hidden');
                nextBtn.classList.add('hidden');
                document.getElementById('leader-timer-text').textContent = "15.0s";
                hideOverlays();
            } else if (currentState.status === 'question') {
                startBtn.classList.add('hidden');
                closeBtn.classList.remove('hidden');
                nextBtn.classList.add('hidden');
                hideOverlays();
                startTimerLoop();
            } else if (currentState.status === 'result') {
                startBtn.classList.add('hidden');
                closeBtn.classList.add('hidden');
                nextBtn.classList.remove('hidden');
                stopTimerLoop();
                showResultVisuals(qData);
            }

            listenViewerAnswersCount();
        }

        function hideOverlays() {
            document.getElementById('leader-inequality-box').classList.add('hidden');
            document.getElementById('leader-opt-1-tag').classList.add('hidden');
            document.getElementById('leader-opt-2-tag').classList.add('hidden');
            document.getElementById('popup-score-a').innerHTML = '';
            document.getElementById('popup-score-b').innerHTML = '';

            // 選択肢カードのスタイルリセット
            document.getElementById('leader-opt-1-card').className = "bg-red-600 border-4 border-red-400 rounded-3xl p-6 flex items-center justify-center text-center relative overflow-hidden shadow-2xl transition-all";
            document.getElementById('leader-opt-2-card').className = "bg-blue-600 border-4 border-blue-400 rounded-3xl p-6 flex items-center justify-center text-center relative overflow-hidden shadow-2xl transition-all";
        }

        function listenViewerAnswersCount() {
            if (!db) return;
            if (unsubscribeAnswers) unsubscribeAnswers();

            unsubscribeAnswers = db.collection('quiz_room').doc('global_state')
                .collection('answers')
                .onSnapshot((snapshot) => {
                    let countA = 0, countB = 0;
                    snapshot.forEach(doc => {
                        const d = doc.data();
                        if (d.questionIndex === currentState.currentIndex) {
                            if (d.team === 'viewer_A' || d.team === 'A') countA++;
                            if (d.team === 'viewer_B' || d.team === 'B') countB++;
                        }
                    });
                    document.getElementById('leader-count-a').textContent = countA;
                    document.getElementById('leader-count-b').textContent = countB;
                });
        }

        function startTimerLoop() {
            stopTimerLoop();
            const startTime = currentState.startTime;
            
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                const remaining = Math.max(0, 15 - elapsed);
                document.getElementById('leader-timer-text').textContent = remaining.toFixed(1) + "s";

                if (remaining <= 0 && currentState.status === 'question' && myRole === 'leader') {
                    sfx.playWrong();
                    closeQuestionAndCalculate(null);
                }
            }, 100);
        }

        function stopTimerLoop() {
            if (timerInterval) clearInterval(timerInterval);
        }

        // Leader Key Controls
        window.addEventListener('keydown', (e) => {
            if (myRole !== 'leader' || !currentState) return;
            const key = e.key.toUpperCase();

            if (e.code === 'Space') {
                e.preventDefault();
                if (currentState.status === 'lobby') startNextQuestion();
                else if (currentState.status === 'result') advanceToNextQuestion();
                return;
            }

            if (currentState.status !== 'question') return;

            if (key === 'S') { sfx.playBuzz(); handleLeaderAnswer('A', 1); }
            else if (key === 'D') { sfx.playBuzz(); handleLeaderAnswer('A', 2); }
            else if (key === 'K') { sfx.playBuzz(); handleLeaderAnswer('B', 1); }
            else if (key === 'L') { sfx.playBuzz(); handleLeaderAnswer('B', 2); }
        });

        document.getElementById('leader-start-btn').addEventListener('click', () => startNextQuestion());
        document.getElementById('leader-close-ans-btn').addEventListener('click', () => closeQuestionAndCalculate(null));
        document.getElementById('leader-next-btn').addEventListener('click', () => advanceToNextQuestion());

        // ゲームリセット処理
        async function resetEntireGame() {
            if (!confirm("ゲーム全体をリセットし、初期状態（ロビー）に戻しますか？\n※現在のスコアや進行状況はすべて消去されます。")) {
                return;
            }

            try {
                const ansSnap = await db.collection('quiz_room').doc('global_state').collection('answers').get();
                const batch = db.batch();
                ansSnap.forEach(doc => batch.delete(doc.ref));
                await batch.commit();

                await db.collection('quiz_room').doc('global_state').set({
                    status: 'lobby',
                    currentIndex: 0,
                    startTime: 0,
                    teamAScore: 0,
                    teamBScore: 0,
                    leaderResult: null
                });

                localStorage.removeItem('quiz_my_score');
                myPersonalScore = 0;
                lastRenderedQIndex = -1;
                localSubmittedOption = null;

                sfx.playTick();
            } catch (err) {
                alert("リセット処理中にエラーが発生しました: " + err.message);
            }
        }

        document.getElementById('leader-reset-game-btn').addEventListener('click', resetEntireGame);

        function startNextQuestion() {
            sfx.playTick();
            db.collection('quiz_room').doc('global_state').update({
                status: 'question',
                startTime: Date.now(),
                leaderResult: null
            });
        }

        function handleLeaderAnswer(team, selectedOption) {
            const qData = questionBank[currentState.currentIndex];
            const isCorrect = (selectedOption === qData.answer);
            const ptsArray = [0, 120, 160, 200];
            const pointsEarned = isCorrect ? ptsArray[qData.difficulty] : -50;

            const leaderResult = {
                team: team,
                option: selectedOption,
                isCorrect: isCorrect,
                pointsEarned: pointsEarned
            };

            if (isCorrect) sfx.playCorrect();
            else sfx.playWrong();

            closeQuestionAndCalculate(leaderResult);
        }

        async function closeQuestionAndCalculate(leaderResult) {
            const qIndex = currentState.currentIndex;
            const qData = questionBank[qIndex];

            let viewerAAdd = 0, viewerBAdd = 0;
            const ptsArrayViewer = [0, 6, 8, 10];

            const answersSnap = await db.collection('quiz_room').doc('global_state')
                .collection('answers').get();

            answersSnap.forEach(doc => {
                const ans = doc.data();
                if (ans.questionIndex === qIndex && ans.isCorrect) {
                    const pts = ptsArrayViewer[qData.difficulty];
                    if (ans.team === 'viewer_A' || ans.team === 'A') viewerAAdd += pts;
                    if (ans.team === 'viewer_B' || ans.team === 'B') viewerBAdd += pts;
                }
            });

            let newScoreA = currentState.teamAScore + viewerAAdd;
            let newScoreB = currentState.teamBScore + viewerBAdd;

            if (leaderResult) {
                if (leaderResult.team === 'A') newScoreA += leaderResult.pointsEarned;
                if (leaderResult.team === 'B') newScoreB += leaderResult.pointsEarned;
            }

            db.collection('quiz_room').doc('global_state').update({
                status: 'result',
                teamAScore: newScoreA,
                teamBScore: newScoreB,
                leaderResult: leaderResult,
                viewerAAdd: viewerAAdd,
                viewerBAdd: viewerBAdd
            });
        }

        function advanceToNextQuestion() {
            const nextIdx = currentState.currentIndex + 1;
            if (nextIdx >= questionBank.length) {
                sfx.playFanfare();
                db.collection('quiz_room').doc('global_state').update({ status: 'finished' });
            } else {
                db.collection('quiz_room').doc('global_state').update({
                    status: 'question',
                    currentIndex: nextIdx,
                    startTime: Date.now(),
                    leaderResult: null
                });
            }
        }

        /* リーダー画面の正誤判定演出（不等号表示 & ハイライト & チーム判定タグ） */
        function showResultVisuals(qData) {
            const correctOpt = qData.answer;

            const inequalityBox = document.getElementById('leader-inequality-box');
            const ineqDesktop = document.getElementById('ineq-desktop');
            const ineqMobile = document.getElementById('ineq-mobile');

            if (correctOpt === 1) {
                ineqDesktop.textContent = '＞';
                ineqMobile.textContent = '∨';
            } else {
                ineqDesktop.textContent = '＜';
                ineqMobile.textContent = '∧';

            inequalityBox.classList.remove('hidden');

            // 2. 早押しで解答したリーダーのチーム・成否のハイライトとタグ表示

            const card1 = document.getElementById('leader-opt-1-card');
            const card2 = document.getElementById('leader-opt-2-card');

            const tag2 = document.getElementById('leader-opt-2-tag');

                const teamName = (res.team === 'A') ? 'チームA' : 'チームB';
                const teamStyle = (res.team === 'A') ? 'bg-amber-400 text-slate-950' : 'bg-purple-600 text-white';
                const resultText = res.isCorrect ? '正解！' : '不正解...';

                if (res.option === 1) {
                    // 赤を選択
                    card1.className = "bg-red-600 border-4 border-yellow-300 ring-4 ring-yellow-300/50 rounded-3xl p-6 flex items-center justify-center text-center relative overflow-hidden shadow-2xl transition-all";
                    card2.className = "bg-blue-900/40 border-2 border-blue-800/40 opacity-30 rounded-3xl p-6 flex items-center justify-center text-center relative overflow-hidden transition-all";
                    
                    tag1.className = `absolute top-3 left-3 md:top-4 md:left-4 text-xs md:text-base font-black px-3.5 py-1 rounded-full shadow-lg z-20 ${teamStyle}`;
                    tag1.textContent = `${teamName}: ${resultText}`;
                    tag1.classList.remove('hidden');
                    tag2.classList.add('hidden');
                } else if (res.option === 2) {
                    // 青を選択
                    card1.className = "bg-red-900/40 border-2 border-red-800/40 opacity-30 rounded-3xl p-6 flex items-center justify-center text-center relative overflow-hidden transition-all";
                    card2.className = "bg-blue-600 border-4 border-yellow-300 ring-4 ring-yellow-300/50 rounded-3xl p-6 flex items-center justify-center text-center relative overflow-hidden shadow-2xl transition-all";
                    
                    tag2.className = `absolute top-3 left-3 md:top-4 md:left-4 text-xs md:text-base font-black px-3.5 py-1 rounded-full shadow-lg z-20 ${teamStyle}`;
                    tag2.textContent = `${teamName}: ${resultText}`;
                    tag2.classList.remove('hidden');
                    tag1.classList.add('hidden');
                }
            } else {
                // リーダーの解答なし（時間切れなど）
                card1.className = "bg-red-600 border-4 border-red-400 rounded-3xl p-6 flex items-center justify-center text-center relative overflow-hidden shadow-2xl transition-all";
                card2.className = "bg-blue-600 border-4 border-blue-400 rounded-3xl p-6 flex items-center justify-center text-center relative overflow-hidden shadow-2xl transition-all";
                tag1.classList.add('hidden');
                tag2.classList.add('hidden');
            }

            // 3. 得点ポップアップ表示（リーダー分 ＋ 視聴者全員分）
            const popA = document.getElementById('popup-score-a');
            const popB = document.getElementById('popup-score-b');
            popA.innerHTML = '';
            popB.innerHTML = '';

            const viewerAAdd = currentState.viewerAAdd || 0;
            const viewerBAdd = currentState.viewerBAdd || 0;

            let htmlA = '';
            if (res && res.team === 'A') {
                const isPos = res.pointsEarned > 0;
                htmlA += `<span class="${isPos ? 'text-emerald-400' : 'text-rose-500'} animate-score-float">${isPos ? '+' : ''}${res.pointsEarned}</span>`;
            }
            if (viewerAAdd > 0) {
                htmlA += `<span class="text-amber-300 animate-score-float ${htmlA ? 'ml-1' : ''}">+${viewerAAdd}</span>`;
            }
            popA.innerHTML = htmlA;

            let htmlB = '';
            if (res && res.team === 'B') {
                const isPos = res.pointsEarned > 0;
                htmlB += `<span class="${isPos ? 'text-emerald-400' : 'text-rose-500'} animate-score-float">${isPos ? '+' : ''}${res.pointsEarned}</span>`;
            }
            if (viewerBAdd > 0) {
                htmlB += `<span class="text-purple-300 animate-score-float ${htmlB ? 'ml-1' : ''}">+${viewerBAdd}</span>`;
            }
            popB.innerHTML = htmlB;
        }

        /* ------------------------------------------------------------------
           9. VIEWER VIEW LOGIC
        ------------------------------------------------------------------ */
        function renderViewerView() {
            const isTeamA = (myRole === 'viewer_A');
            const headerCard = document.getElementById('viewer-header-card');
            const teamBadge = document.getElementById('viewer-team-badge');
            const teamName = document.getElementById('viewer-team-name');

            if (isTeamA) {
                headerCard.className = "bg-slate-900 border border-amber-500/60 rounded-xl p-3 flex justify-between items-center shadow-md";
                teamBadge.className = "w-8 h-8 rounded-full flex items-center justify-center font-black text-sm bg-amber-500 text-slate-950";
                teamBadge.textContent = "A";
                teamName.textContent = "チーム A 視聴者";
                teamName.className = "font-bold text-xs text-amber-300";
            } else {
                headerCard.className = "bg-slate-900 border border-purple-500/60 rounded-xl p-3 flex justify-between items-center shadow-md";
                teamBadge.className = "w-8 h-8 rounded-full flex items-center justify-center font-black text-sm bg-purple-600 text-white";
                teamBadge.textContent = "B";
                teamName.textContent = "チーム B 視聴者";
                teamName.className = "font-bold text-xs text-purple-300";
            }

            document.getElementById('viewer-my-score').textContent = myPersonalScore;

            const waitingView = document.getElementById('viewer-waiting-view');
            const questionView = document.getElementById('viewer-question-view');
            const resultOverlay = document.getElementById('viewer-result-overlay');

            const qIndex = currentState.currentIndex;
            const qData = questionBank[qIndex] || questionBank[0];

            if (currentState.status === 'lobby') {
                waitingView.classList.remove('hidden');
                questionView.classList.add('hidden');
                resultOverlay.classList.add('hidden');
                document.getElementById('viewer-q-num').textContent = "待機中";
                document.getElementById('viewer-timer-display').textContent = "15.0s";

                myPersonalScore = 0;
                localStorage.setItem('quiz_my_score', '0');
                localSubmittedOption = null;
                this.lastViewerQIndex = -1;
                this.lastProcessedQIndex = -1;
            } else if (currentState.status === 'question') {
                waitingView.classList.add('hidden');
                questionView.classList.remove('hidden');
                resultOverlay.classList.add('hidden');

                document.getElementById('viewer-q-num').textContent = `Q${qIndex + 1}`;
                
                if (this.lastViewerQIndex !== qIndex) {
                    this.lastViewerQIndex = qIndex;
                    localSubmittedOption = null;
                    renderMathText(document.getElementById('viewer-q-text'), qData.questionText);
                    renderMathText(document.getElementById('viewer-opt1-text'), qData.option1);
                    renderMathText(document.getElementById('viewer-opt2-text'), qData.option2);
                }

                updateViewerButtonStyles(qData, false);
                startViewerTimer();
            } else if (currentState.status === 'result') {
                waitingView.classList.add('hidden');
                questionView.classList.remove('hidden');
                resultOverlay.classList.remove('hidden');

                stopViewerTimer();
                updateViewerButtonStyles(qData, true);
                renderViewerResult(qData);
            }
        }

        function updateViewerButtonStyles(qData, isResultPhase) {
            const btn1 = document.getElementById('viewer-btn-opt1');
            const btn2 = document.getElementById('viewer-btn-opt2');
            const selTag1 = document.getElementById('viewer-opt1-selected-tag');
            const selTag2 = document.getElementById('viewer-opt2-selected-tag');
            const correctTag1 = document.getElementById('viewer-opt1-correct-tag');
            const correctTag2 = document.getElementById('viewer-opt2-correct-tag');

            if (localSubmittedOption === 1) {
                btn1.className = "w-full bg-red-600 border-4 border-yellow-300 ring-4 ring-yellow-300/50 rounded-2xl p-4 flex flex-col items-center justify-center transition shadow-2xl relative pointer-events-none";
                btn2.className = "w-full bg-blue-900/40 border-2 border-blue-800/40 opacity-30 rounded-2xl p-4 flex flex-col items-center justify-center transition pointer-events-none";
                selTag1.classList.remove('hidden');
                selTag2.classList.add('hidden');
            } else if (localSubmittedOption === 2) {
                btn1.className = "w-full bg-red-900/40 border-2 border-red-800/40 opacity-30 rounded-2xl p-4 flex flex-col items-center justify-center transition pointer-events-none";
                btn2.className = "w-full bg-blue-600 border-4 border-yellow-300 ring-4 ring-yellow-300/50 rounded-2xl p-4 flex flex-col items-center justify-center transition shadow-2xl relative pointer-events-none";
                selTag1.classList.add('hidden');
                selTag2.classList.remove('hidden');
            } else {
                const pointerStyle = isResultPhase ? "pointer-events-none" : "cursor-pointer active:scale-95";
                btn1.className = `w-full bg-red-600 hover:bg-red-500 border-2 border-red-400 rounded-2xl p-4 flex flex-col items-center justify-center transition shadow-lg relative ${pointerStyle}`;
                btn2.className = `w-full bg-blue-600 hover:bg-blue-500 border-2 border-blue-400 rounded-2xl p-4 flex flex-col items-center justify-center transition shadow-lg relative ${pointerStyle}`;
                selTag1.classList.add('hidden');
                selTag2.classList.add('hidden');
            }

            if (isResultPhase && qData) {
                if (qData.answer === 1) {
                    correctTag1.classList.remove('hidden');
                    correctTag2.classList.add('hidden');
                } else if (qData.answer === 2) {
                    correctTag1.classList.add('hidden');
                    correctTag2.classList.remove('hidden');
                }
            } else {
                correctTag1.classList.add('hidden');
                correctTag2.classList.add('hidden');
            }
        }

        function startViewerTimer() {
            stopViewerTimer();

            const startTime = currentState ? currentState.startTime : 0;
            const timerDisplay = document.getElementById('viewer-timer-display');
            if (!startTime) return;

            viewerTimerInterval = setInterval(() => {
                if (!currentState || currentState.status !== 'question') {
                    stopViewerTimer();
                    return;
                }
                const elapsed = (Date.now() - startTime) / 1000;
                const remaining = Math.max(0, 15 - elapsed);
                if (timerDisplay) {
                    timerDisplay.textContent = remaining.toFixed(1) + "s";
                }
            }, 100);
        }

        function stopViewerTimer() {
            if (viewerTimerInterval) {
                clearInterval(viewerTimerInterval);
                viewerTimerInterval = null;
            }
        }

        document.getElementById('viewer-btn-opt1').addEventListener('click', () => submitViewerAnswer(1));
        document.getElementById('viewer-btn-opt2').addEventListener('click', () => submitViewerAnswer(2));

        window.addEventListener('keydown', (e) => {
            if ((myRole === 'viewer_A' || myRole === 'viewer_B') && currentState && currentState.status === 'question' && localSubmittedOption === null) {
                if (e.key === 'ArrowLeft') submitViewerAnswer(1);
                else if (e.key === 'ArrowRight') submitViewerAnswer(2);
            }
        });

        async function submitViewerAnswer(option) {
            if (localSubmittedOption !== null || !currentState || currentState.status !== 'question') return;

            sfx.playTick();
            localSubmittedOption = option;

            const qIndex = currentState.currentIndex;
            const qData = questionBank[qIndex];
            const isCorrect = (option === qData.answer);

            updateViewerButtonStyles(qData, false);

            try {
                await db.collection('quiz_room').doc('global_state')
                    .collection('answers').doc(viewerId).set({
                        team: myRole,
                        questionIndex: qIndex,
                        option: option,
                        isCorrect: isCorrect,
                        timestamp: Date.now()
                    });
            } catch (e) {}
        }

        function renderViewerResult(qData) {
            const markEl = document.getElementById('viewer-result-mark');
            const msgEl = document.getElementById('viewer-result-msg');

            const isCorrect = (localSubmittedOption === qData.answer);
            const ptsArray = [0, 6, 8, 10];
            const gained = isCorrect ? ptsArray[qData.difficulty] : 0;

            if (localSubmittedOption !== null) {
                if (isCorrect) {
                    sfx.playCorrect();
                    markEl.innerHTML = `<span class="text-emerald-400 animate-mark-pop inline-block"><i class="fa-regular fa-circle"></i></span>`;
                    msgEl.textContent = `正解！ +${gained}pt`;
                    msgEl.className = "text-2xl font-black text-emerald-400";

                    if (!this.lastProcessedQIndex || this.lastProcessedQIndex !== currentState.currentIndex) {
                        this.lastProcessedQIndex = currentState.currentIndex;
                        myPersonalScore += gained;
                        localStorage.setItem('quiz_my_score', myPersonalScore.toString());
                    }
                } else {
                    sfx.playWrong();
                    markEl.innerHTML = `<span class="text-rose-500 animate-mark-pop inline-block"><i class="fa-solid fa-xmark"></i></span>`;
                    msgEl.textContent = `不正解...`;
                    msgEl.className = "text-2xl font-black text-rose-500";
                }
            } else {
                markEl.innerHTML = `<span class="text-amber-400 inline-block"><i class="fa-solid fa-minus"></i></span>`;
                msgEl.textContent = `時間切れ`;
                msgEl.className = "text-2xl font-black text-amber-400";
            }
        }

        /* ------------------------------------------------------------------
           10. FINISHED VIEW LOGIC
        ------------------------------------------------------------------ */
        function renderFinishedView() {
            const scoreA = currentState.teamAScore || 0;
            const scoreB = currentState.teamBScore || 0;

            const winnerText = document.getElementById('winner-team-text');
            const scoresText = document.getElementById('final-scores-text');
            const viewerSummary = document.getElementById('viewer-final-summary');
            const resetBtn = document.getElementById('leader-finish-reset-btn');

            scoresText.textContent = `TEAM A: ${scoreA} pt  vs  TEAM B: ${scoreB} pt`;

            if (scoreA > scoreB) {
                winnerText.textContent = "🏆 チーム A の勝利！";
                winnerText.className = "text-3xl font-black text-amber-400";
            } else if (scoreB > scoreA) {
                winnerText.textContent = "🏆 チーム B の勝利！";
                winnerText.className = "text-3xl font-black text-purple-400";
            } else {
                winnerText.textContent = "🤝 引き分け！";
                winnerText.className = "text-3xl font-black text-yellow-300";
            }

            try { confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } }); } catch(e) {}

            if (myRole === 'leader') {
                resetBtn.classList.remove('hidden');
                viewerSummary.classList.add('hidden');
            } else {
                resetBtn.classList.add('hidden');
                viewerSummary.classList.remove('hidden');
                document.getElementById('viewer-final-pts').textContent = myPersonalScore;
            }
        }

        document.getElementById('leader-finish-reset-btn').addEventListener('click', resetEntireGame);

        /* ------------------------------------------------------------------
           11. INIT
        ------------------------------------------------------------------ */
        window.addEventListener('DOMContentLoaded', () => {
            initFirebase();
            if (myRole) resetRoleBtn.classList.remove('hidden');
        });
    </script>
</body>
</html>
